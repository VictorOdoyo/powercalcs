name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Analytical and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q powercalcs
      - name: Verify installed CLI outside checkout
        working-directory: /tmp
        run: powercalcs list
